<circle r="5" fill="#b6ff9e" filter="url(#glow)"><animateMotion dur="4s" begin="3s" repeatCount="indefinite" path="M200,207.0 L800,207.0"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.08;.9;1" dur="4s" begin="3s" repeatCount="indefinite"/></circle>
